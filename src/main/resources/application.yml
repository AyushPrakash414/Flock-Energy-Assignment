server:
  port: 8080

spring:
  application:
    name: urja-meter-ops-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cache:
    type: caffeine

# Upstream Urja portal configuration — credentials supplied via application-local.yml or environment variables
urja:
  portal:
    base-url: ${URJA_PORTAL_BASE_URL:https://urja-ops.flockenergy.tech}
    email: ${URJA_PORTAL_EMAIL:}
    password: ${URJA_PORTAL_PASSWORD:}
    connect-timeout-ms: 5000
    read-timeout-ms: 15000
    cache-ttl-minutes: 15

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    com.flockenergy.meterops: DEBUG
    org.springframework.web.client: WARN
